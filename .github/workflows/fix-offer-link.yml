name: Fix Google One offer link

on:
  push:
    paths:
      - '.github/workflows/fix-offer-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch offer-link extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('google_automation.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _extract_payment_link(')
          end = text.index('\n\ndef _navigate_google_one(', start)

          new_func = '''def _extract_payment_link(driver: webdriver.Chrome) -> Optional[str]:
    """Return only a real Google One activation/offer URL."""
    offer_pat = re.compile(
        r"https://(?:www\\.)?one\\.google\\.com/"
        r"(?:offer/[^\\s'\"<>)]*|partner-eft-onboard/[^\\s'\"<>)]*)",
        re.IGNORECASE,
    )

    def clean(url: str) -> Optional[str]:
        url = (url or '').strip().rstrip('.,;')
        return url if offer_pat.fullmatch(url) else None

    # Prefer actual anchor hrefs.
    for link in driver.find_elements(By.TAG_NAME, 'a'):
        try:
            href = clean(link.get_attribute('href') or '')
            if href:
                return href
        except Exception:
            continue

    # Some Google pages expose the generated URL only in their HTML.
    try:
        for match in offer_pat.findall(driver.page_source or ''):
            href = clean(match)
            if href:
                return href
    except Exception:
        pass

    # Check buttons and data attributes for an activation URL.
    for el in driver.find_elements(By.CSS_SELECTOR, "button, [role='button'], [data-href], [data-url]"):
        try:
            for value in (
                el.get_attribute('href') or '',
                el.get_attribute('data-href') or '',
                el.get_attribute('data-url') or '',
            ):
                href = clean(value)
                if href:
                    return href
            try:
                parent = el.find_element(By.XPATH, 'ancestor::a[1]')
                href = clean(parent.get_attribute('href') or '')
                if href:
                    return href
            except NoSuchElementException:
                pass
        except Exception:
            continue

    # Never return /benefits/... or the current page as an offer link.
    return None
'''

          path.write_text(text[:start] + new_func + text[end:], encoding='utf-8')
          PY

      - name: Commit patched file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google_automation.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: return actual Google One activation URL"
          git push
